function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
function suportado(){return window.crypto&&crypto.subtle&&window.DecompressionStream&&window.TextDecoder;}
async function abrir(rawKey){
  var key=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAC.i)},key,b64(PAC.c));
  var st=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
  var html=await new Response(st).text();
  document.open();document.write(html);document.close();}
async function derivar(u,p){
  var mat=await crypto.subtle.importKey('raw',new TextEncoder().encode(u.trim().toLowerCase()+'\n'+p),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(PAC.s),iterations:PAC.n},mat,256));}

try{var k=sessionStorage.getItem('vl_k');if(k){abrir(b64(k)).catch(function(){sessionStorage.removeItem('vl_k');});}}catch(x){}
document.getElementById('f').addEventListener('submit',async function(ev){

  try{

    try{sessionStorage.setItem('vl_k',btoa(String.fromCharCode.apply(null,raw)));}catch(x){}
    b.textContent='Abrindo...';await abrir(raw);
  }catch(x){
    try{sessionStorage.removeItem('vl_k');}catch(y){}
    e.textContent='Usuário ou senha inválidos.';b.disabled=false;b.textContent='Entrar';}
});
